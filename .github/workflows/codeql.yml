name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# `cancel-in-progress: false` alone does not protect `main`, because queuing a
# run cancels whatever is already pending in its group. Keying non-PR events on
# `github.sha` gives each commit its own group, so a `main` analysis is never
# cancelled and never leaves a gap in the code-scanning baseline. This workflow
# also runs on `schedule`, which is why `github.event_name` is in the key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Job-level `permissions` REPLACES the workflow default rather than merging
    # with it, so `contents: read` is restated here; without it this job would
    # run with `contents: none`.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: rust
          queries: security-extended
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - run: cargo build --workspace
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
