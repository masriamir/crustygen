name: PR Title

# PRs squash-merge, so the PR title becomes the only commit on `main` — write it
# as a real Conventional Commit; lefthook's `commit-msg` hook validates branch
# commits, which are exactly what squash-merge discards. Calls the shared
# reusable workflow, which self-tests and then runs the vendored validator in
# scripts/ — kept identical to the canonical copy by the meta-check drift gate.
# Not yet a required check; the ruleset picks it up in a follow-up.
on:
  pull_request:
    # `edited` catches a retitle; `synchronize` re-attaches the check to each new
    # head SHA, so a push can't leave the latest commit without this signal.
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    uses: masriamir/.github/.github/workflows/pr-title.yml@ecd746f06c5c0bf384e90981c274f563c7781186 # main branch pin
