name: Bug report
description: Report a reproducible defect in crustygen
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        The IR (or map-spec) and the command that reproduce it, plus any WAD produced and the
        engine you loaded it in. For a bad map, attach or link the offending WAD.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: crustygen commit and rustc version
    validations:
      required: false
