name: Feature request
description: Suggest an enhancement to crustygen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What map, geometry, or verification case is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The desired IR/spec surface, compile pass, or verifier check.
    validations:
      required: true
