[workspace]

[package]
name = "crustygen"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
description = "Generates playable Doom maps from a room-graph IR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masriamir/crustygen"
readme = "README.md"
keywords = ["doom", "wad", "udmf", "level-generation"]
categories = ["game-development"]

[dependencies]
crustywad = { version = "0.9.4", features = ["write", "nodebuild"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
