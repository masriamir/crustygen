# Thresholds are advisory gates on the checks; the working review gate is the
# codecov PR comment's missing-lines table, which reports uncovered changed
# lines even when the thresholded checks pass.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%
comment:
  layout: "reach, diff, files"
  require_changes: true
# `examples/` holds measurement probes (`liftprobe`): reproducible tools that
# are compiled and linted by CI's `--all-targets` jobs but never executed under
# `cargo test`, so they carry no coverage by construction. Excluding them keeps
# the patch check about the crate, not the probes.
ignore:
  - "examples/**"
