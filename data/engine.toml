# Non-monster props that block movement or hang from a ceiling — data
# rules P3 (passage width), P21 (light sources match lighting), and P22
# (hanging decoration headroom) will need. Radius, height, the blocking
# flag, and (where true) the hanging flag are read from `mobjinfo` the same
# way `[species.*]` is; doomednums for these same props live in
# vocabulary.toml's `[things]` table under the identical key names. Only
# props that actually block (MF_SOLID) or hang (MF_SPAWNCEILING) belong
# here — `candle` in vocabulary.toml is neither, so it carries no entry in
# this table, and none of the non-blocking, non-hanging gore props
# (corpses, gibs, blood pools) do either.
[props.barrel]
radius = 10
height = 42
blocks = true
source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo[MT_BARREL]: radius = 10*FRACUNIT, height = 42*FRACUNIT, doomednum = 2035, flags = MF_SOLID|MF_SHOOTABLE|MF_NOBLOOD — MF_SOLID means the barrel blocks movement until destroyed. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c"

