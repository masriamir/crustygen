# Health and armor pickup amounts and caps, from p_inter.c's
# P_TouchSpecialThing pickup switch, keyed to match vocabulary.toml's
# [things] entries of the same name (stimpack, medikit, health_bonus,
# armor_bonus, green_armor, blue_armor) so `sustain.health_budget`
# (tight | balanced | generous) and the explicit counts beside it have real
# numbers to derive from.
#
# `cap` is the health/armor ceiling the pickup cannot push past. stimpack
# and medikit go through P_GiveBody, which is gated on and clamped to
# MAXHEALTH (100, p_local.h) — they cannot push health past 100. health_bonus
# and armor_bonus bypass that gate entirely (P_TouchSpecialThing increments
# health/armorpoints directly) and are each clamped instead to a literal 200
# in the same switch cases — "can go over 100%" is an inline comment on both.
#
# `class`, where present, is the absorption class (`armortype`) the pickup
# sets. green_armor and blue_armor call P_GiveArmor, which sets `amount` as
# a flat value (not additive — the pickup is skipped entirely if the
# player's current armorpoints already meet or exceed it) and unconditionally
# sets armortype to `class`. armor_bonus does not call P_GiveArmor: it only
# sets armortype to 1 as a side effect, and only if the player had none yet
# (`if (!player->armortype) player->armortype = 1;`) — recorded here as the
# same `class = 1` value, with that conditionality noted rather than modeled,
# since this table has no notion of a player's current state to condition on.
[pickups.stimpack]
amount = 10
cap = 100
source = "id-Software/DOOM linuxdoom-1.10/p_inter.c, P_TouchSpecialThing: 'case SPR_STIM: if (!P_GiveBody (player, 10)) return; player->message = GOTSTIM; break;'. P_GiveBody: 'if (player->health >= MAXHEALTH) return false; player->health += num; if (player->health > MAXHEALTH) player->health = MAXHEALTH;'. p_local.h: '#define MAXHEALTH 100'. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_inter.c and .../p_local.h"

[pickups.medikit]
amount = 25
cap = 100
source = "id-Software/DOOM linuxdoom-1.10/p_inter.c, P_TouchSpecialThing: 'case SPR_MEDI: if (!P_GiveBody (player, 25)) return; if (player->health < 25) player->message = GOTMEDINEED; else player->message = GOTMEDIKIT; break;' — same P_GiveBody/MAXHEALTH gate as stimpack. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_inter.c and .../p_local.h"

[pickups.health_bonus]
amount = 1
cap = 200
source = "id-Software/DOOM linuxdoom-1.10/p_inter.c, P_TouchSpecialThing: 'case SPR_BON1: player->health++; // can go over 100% / if (player->health > 200) player->health = 200; ... player->message = GOTHTHBONUS; break;' — no P_GiveBody call, so no MAXHEALTH gate; the 200 ceiling is a literal in this case alone. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_inter.c"

[pickups.armor_bonus]
amount = 1
cap = 200
class = 1
source = "id-Software/DOOM linuxdoom-1.10/p_inter.c, P_TouchSpecialThing: 'case SPR_BON2: player->armorpoints++; // can go over 100% / if (player->armorpoints > 200) player->armorpoints = 200; / if (!player->armortype) player->armortype = 1; ... player->message = GOTARMBONUS; break;' — no P_GiveArmor call; armortype is set to 1 only when the player currently has none. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_inter.c"

[pickups.green_armor]
amount = 100
cap = 100
class = 1
source = "id-Software/DOOM linuxdoom-1.10/p_inter.c, P_TouchSpecialThing: 'case SPR_ARM1: if (!P_GiveArmor (player, 1)) return; player->message = GOTARMOR; break;'. P_GiveArmor: 'hits = armortype*100; if (player->armorpoints >= hits) return false; player->armortype = armortype; player->armorpoints = hits;' — for armortype 1, hits = 100: a flat set, not additive, and skipped if the player's armor already meets or exceeds it. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_inter.c"

[pickups.blue_armor]
amount = 200
cap = 200
class = 2
source = "id-Software/DOOM linuxdoom-1.10/p_inter.c, P_TouchSpecialThing: 'case SPR_ARM2: if (!P_GiveArmor (player, 2)) return; player->message = GOTMEGA; break;'. P_GiveArmor: for armortype 2, hits = armortype*100 = 200 — same flat-set, skip-if-not-greater mechanics as green_armor. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_inter.c"

# The sector special that marks a sector "secret" (rule P18). This is a
# sector type, not a linedef special — a distinct numeric space from
# `vocabulary.toml`'s [specials] table.
[sector]
secret = 9
source = "id-Software/DOOM linuxdoom-1.10/p_spec.c, P_PlayerInSpecialSector: 'case 9: // SECRET SECTOR / player->secretcount++; / sector->special = 0; break;' — the engine's secret counter increments only when the player's sector special reads 9, which is why P18 checks the special rather than any authorial intent. P_SpawnSpecials confirms the same type drives the level-load %secrets total: 'case 9: // SECRET SECTOR / totalsecret++; break;'. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_spec.c"

# Sector specials for the three damage tiers `flats.liquid.damage_tier`
# names (light | medium | heavy). All three deal their damage once every 32
# tics ('if (!(leveltime&0x1f))') and are blocked entirely by a radiation
# suit or the `pw_ironfeet` power ('if (!player->powers[pw_ironfeet])'),
# which is the primitive P17 (damage survivability) reasons about. Type 16
# is used for "heavy" rather than the mechanically identical type 4: both
# deal 20 damage, but 4 ("STROBE HURT") also drives a strobing light effect
# (P_SpawnStrobeFlash in P_SpawnSpecials) that has nothing to do with the
# spec's damage_tier concept, so 16 is the tier without a side effect riding
# along with it.
[sector.damage]
light = 7
medium = 5
heavy = 16
source = "id-Software/DOOM linuxdoom-1.10/p_spec.c, P_PlayerInSpecialSector: 'case 7: // NUKAGE DAMAGE ... P_DamageMobj (player->mo, NULL, NULL, 5);' (light, 5 damage); 'case 5: // HELLSLIME DAMAGE ... P_DamageMobj (player->mo, NULL, NULL, 10);' (medium, 10 damage); 'case 16: // SUPER HELLSLIME DAMAGE / case 4: // STROBE HURT ... P_DamageMobj (player->mo, NULL, NULL, 20);' (heavy, 20 damage; 16 and 4 share the same damage case, but only 4 is also handled in P_SpawnSpecials' light-effect switch). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_spec.c"

# Linedef attribute flag bits (`maplinedef_t.flags` in doomdata.h) — a third
# numeric space distinct from vocabulary.toml's [specials] (linedef
# *specials*) and this file's [sector]/[sector.damage] (*sector* specials).
# `combat.block_monster_lines` needs `block_monsters`; `combat.sound.
# block_sound_at` needs `sound_block`.
#
# UDMF's `doom` namespace spells each bit as its own named boolean field on
# the linedef object rather than packing them — `blockmonsters` and
# `blocksound` respectively — matching the convention `emit_textmap`
# already follows for `blocking`/`dontpegbottom`/`dontpegtop`. The values
# below are the ML_* bit values themselves, kept for citation traceability;
# they are not written to TEXTMAP directly. Not wired into any emission
# path yet — see KNOWN-GAPS.md.
[linedef.flags]
block_monsters = 2
sound_block = 64
source = "id-Software/DOOM linuxdoom-1.10/doomdata.h: '#define ML_BLOCKMONSTERS 2 // Blocks monsters only.' and '#define ML_SOUNDBLOCK 64 // Sound rendering: dont let sound cross two of these.' Behavior confirmed in linuxdoom-1.10/p_map.c, PIT_CheckLine: 'if ( !tmthing->player && ld->flags & ML_BLOCKMONSTERS ) return false; // block monsters only' — gated on '!tmthing->player', so it never blocks the player, only non-player things — and linuxdoom-1.10/p_enemy.c, P_RecursiveSound (called from P_NoiseAlert): 'if (check->flags & ML_SOUNDBLOCK) { if (!soundblocks) P_RecursiveSound (other, 1); } else P_RecursiveSound (other, soundblocks);' — a line flagged ML_SOUNDBLOCK lets the sound-alert flood cross it exactly once (soundblocks 0->1) before stopping, rather than propagating indefinitely. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/doomdata.h, .../p_map.c, and .../p_enemy.c"
