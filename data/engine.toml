# Engine constants for the crustygen compiler.
#
# Every table below carries a `source` field naming the primary reference the
# value was read from. Values are sourced from the original Doom source
# release (id-Software/DOOM, linuxdoom-1.10) pinned to commit
# a77dfb96cb91780ca334d0d4cfd86957558007e0, the UDMF specification, or the
# Unofficial Doom Specs (the standard primary reference for the classic
# binary lump layouts UDMF supersedes). Do not hand-edit a numeric value
# without updating its citation.

[movement]
max_step_height = 24
source = "id-Software/DOOM linuxdoom-1.10/p_map.c, P_TryMove: 'tmfloorz - thing->z > 24*FRACUNIT ) return false; // too big a step up' (also mirrored in PTR_SlideTraverse). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_map.c — matches placeholder, unchanged"

[player]
radius = 16
height = 56
source = "id-Software/DOOM linuxdoom-1.10/p_local.h: '#define PLAYERRADIUS 16*FRACUNIT'; linuxdoom-1.10/info.c mobjinfo[MT_PLAYER]: height = 56*FRACUNIT. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_local.h and .../info.c — matches placeholder, unchanged"

[door]
clearance_allowance = 4
source = "id-Software/DOOM linuxdoom-1.10/p_doors.c, EV_DoDoor: 'door->topheight = P_FindLowestCeilingSurrounding(sec); door->topheight -= 4*FRACUNIT;' https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_doors.c — matches placeholder, unchanged"

[flat]
tile = 64
source = "id-Software/DOOM linuxdoom-1.10/r_plane.c, R_MapPlane: 'ds_xfrac = viewx + FixedMul(finecosine[angle], length); ds_yfrac = -viewy - FixedMul(finesine[angle], length);' — a flat span's texture coordinates are the world coordinates themselves; linuxdoom-1.10/r_draw.c, R_DrawSpan: 'spot = ((yfrac>>(16-6))&(63*64)) + ((xfrac>>16)&63);' — which masks 6 bits per axis, so the 64x64 flat repeats every 64 map units in world space. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/r_plane.c and .../r_draw.c"

[plat]
speed_normal = 4
speed_fast = 8
wait_tics = 105
max_active = 30
source = "id-Software/DOOM linuxdoom-1.10/p_spec.h: '#define PLATWAIT 3', '#define PLATSPEED FRACUNIT', '#define MAXPLATS 30'; linuxdoom-1.10/p_plats.c, EV_DoPlat: 'case downWaitUpStay: plat->speed = PLATSPEED * 4; ... plat->wait = 35*PLATWAIT;' and 'case blazeDWUS: plat->speed = PLATSPEED * 8;' — speeds in map units per tic (FRACUNIT is one unit), wait in tics (35 per second); P_AddActivePlat: 'I_Error (\"P_AddActivePlat: no more plats!\");' past MAXPLATS simultaneously active plats. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_spec.h and .../p_plats.c"

[floor]
speed = 1
turbo_multiplier = 4
plat_change_divisor = 2
source = "id-Software/DOOM linuxdoom-1.10/p_spec.h: '#define FLOORSPEED FRACUNIT' (line 600) — one map unit per tic; linuxdoom-1.10/p_floor.c, EV_DoFloor: 'case turboLower: ... floor->speed = FLOORSPEED * 4;' (line 310) and 'case raiseFloorTurbo: ... floor->speed = FLOORSPEED*4;' (334) — the turbo multiplier; linuxdoom-1.10/p_plats.c, EV_DoPlat: 'case raiseToNearestAndChange: plat->speed = PLATSPEED/2;' and 'case raiseAndChange: plat->speed = PLATSPEED/2;' — the raise-and-change plats move at half a unit per tic. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_spec.h, .../p_floor.c and .../p_plats.c"
drop_wall_thickness = [8, 16, 32, 64]
bridge_depth_step = 8
curated = "Not engine constants. A drop wall's depth along its gap and the 8-unit grain of a bridge's pit depth are authoring choices bounded by the corpus: drop walls have a min side under 64 on 54 % of the sample (modal bounding box 16x64, then 64x64 and 16x128) and bridge travels are multiples of 8 with median 96 (docs/measurements/floor-shapes-2026-09-02.md §D). The list mirrors `Ir::LIFT_ALCOVE_DIMENSIONS`."

[light]
min = 0
max = 255
source = "The Unofficial Doom Specs v1.666, section [4-9] SECTORS: 'lightlevel of this sector: 0 = total dark, 255 (0xff) = maximum light. There are actually only 32 brightnesses possible (see COLORMAP [8-2]).' https://ruinworld.sourceforge.net/notes/dmsp1666.html — corroborated by the UDMF spec's sector 'lightlevel = <integer>; // Light level. Default = 160.' (same 0-255 universe; UDMF itself states no explicit clamp) at https://github.com/rheit/zdoom/blob/fa2bf5a53f10c8f6b69403c3d0bebd456303fab7/specs/udmf.txt — matches placeholder, unchanged"

