# Vocabulary tables for the crustygen compiler: thing type numbers and the
# per-theme texture/flat names the compiler emits into TEXTMAP.
#
# `things` is sourced from the original Doom source release (see
# data/engine.toml header for the pinned commit). `textures` is sourced by
# direct lookup against the local Freedoom IWAD fixtures, since Freedoom is a
# drop-in IWAD replacement that deliberately mirrors Doom's lump/texture
# names — a name resolving there is a name that resolves against Doom too.

[things]
player1_start = 1
zombieman = 3004
shotgun_guy = 9
imp = 3001
pinky = 3002
blue_card = 5
yellow_card = 6
red_card = 13
blue_skull = 40
yellow_skull = 39
red_skull = 38
teleport_dest = 14
source = "id-Software/DOOM linuxdoom-1.10/p_mobj.c, P_SpawnMapThing: 'if (mthing->type <= 4) { playerstarts[mthing->type-1] = *mthing; ... }' establishes doomednum 1 as player 1's start. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_mobj.c — monster doomednums (zombieman 3004, shotgun_guy 9, imp 3001, pinky 3002) cross-checked against info.c mobjinfo in the same pinned commit, see data/engine.toml [species.*] citations"
keys_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo, read at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0. Each entry's first field is its doomednum and its second its spawnstate, and states[] at the same commit gives each spawnstate's sprite: MT_MISC4 = { 5, S_BKEY } with S_BKEY = {SPR_BKEY,...} (blue card); MT_MISC6 = { 6, S_YKEY } / SPR_YKEY (yellow card); MT_MISC5 = { 13, S_RKEY } / SPR_RKEY (red card); MT_MISC9 = { 40, S_BSKULL } / SPR_BSKU (blue skull); MT_MISC7 = { 39, S_YSKULL } / SPR_YSKU (yellow skull); MT_MISC8 = { 38, S_RSKULL } / SPR_RSKU (red skull). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c"
teleport_dest_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo[MT_TELEPORTMAN]: doomednum = 14 (with spawnstate S_NULL, so it renders nothing — it is a pure position/angle marker). p_telept.c, EV_Teleport confirms the role: it walks every sector whose tag equals the teleport line's tag, finds the one MT_TELEPORTMAN mobj in that sector ('if (m->type != MT_TELEPORTMAN) continue;'), and moves the teleporting thing to that mobj's (x, y) and angle ('thing->angle = m->angle;'). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c and .../p_telept.c"

# Monster species beyond the original four. Radius/height/hitscan for each
# live alongside their citation in engine.toml's [species.*] table, under
# the identical key name; this table carries only the doomednum.
#
# `spider_mastermind` is named for the task's request ("spider mastermind"),
# not the map-spec template's `combat.boss` enum literal ("mastermind") —
# no alias is added here; bridging that short form to this key is left to
# the compiler layer that reads `combat.boss`, since guessing which of the
# two the future code will want is exactly the kind of unsourced choice
# this table exists to avoid.
spectre = 58
chaingunner = 65
cacodemon = 3005
lost_soul = 3006
pain_elemental = 71
hell_knight = 69
baron_of_hell = 3003
revenant = 66
mancubus = 67
arachnotron = 68
archvile = 64
cyberdemon = 16
spider_mastermind = 7
wolfenstein_ss = 84
monsters_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums, read at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0: mobjinfo[MT_SHADOWS] = 58 (spectre), mobjinfo[MT_CHAINGUY] = 65 (chaingunner), mobjinfo[MT_HEAD] = 3005 (cacodemon), mobjinfo[MT_SKULL] = 3006 (lost_soul), mobjinfo[MT_PAIN] = 71 (pain_elemental), mobjinfo[MT_KNIGHT] = 69 (hell_knight), mobjinfo[MT_BRUISER] = 3003 (baron_of_hell), mobjinfo[MT_UNDEAD] = 66 (revenant), mobjinfo[MT_FATSO] = 67 (mancubus), mobjinfo[MT_BABY] = 68 (arachnotron), mobjinfo[MT_VILE] = 64 (archvile), mobjinfo[MT_CYBORG] = 16 (cyberdemon), mobjinfo[MT_SPIDER] = 7 (spider_mastermind), mobjinfo[MT_WOLFSS] = 84 (wolfenstein_ss). Dims and hitscan behavior are cross-checked against p_enemy.c's A_* attack functions per data/engine.toml [species.*] citation. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c"

