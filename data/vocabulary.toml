# Health and armor. Key names match `sustain.health.{stimpack,medikit,
# health_bonus}` in the map-spec template exactly. `sustain.armor` names
# its two armor tiers `green`/`blue` rather than `green_armor`/`blue_armor`
# — a naming seam left for the compiler layer to bridge, the same call made
# for `spider_mastermind` above, rather than guessing which bare name the
# future code will actually use in a table that also holds unrelated
# entries (a plain `green`/`blue` key risks colliding with some future
# non-armor `green`/`blue` thing in this same flat table).
stimpack = 2011
medikit = 2012
health_bonus = 2014
armor_bonus = 2015
green_armor = 2018
blue_armor = 2019
health_armor_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums: MT_MISC10 = 2011 (S_STIM), MT_MISC11 = 2012 (S_MEDI), MT_MISC2 = 2014 (S_BON1), MT_MISC3 = 2015 (S_BON2), MT_MISC0 = 2018 (S_ARM1), MT_MISC1 = 2019 (S_ARM2), at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0. Which bonus is health versus armor is NOT decidable from mobjinfo/sprite name alone (S_BON1/S_BON2 do not say); resolved instead from p_inter.c, P_TouchSpecialThing's pickup switch on `special->sprite`: 'case SPR_BON1: player->health++; ... GOTHTHBONUS' (2014 = health bonus) and 'case SPR_BON2: player->armorpoints++; ... GOTARMBONUS' (2015 = armor bonus); likewise 'case SPR_ARM1: P_GiveArmor(player,1); ... GOTARMOR' (2018 = green/basic armor) and 'case SPR_ARM2: P_GiveArmor(player,2); ... GOTMEGA' (2019 = blue/mega armor). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c and .../p_inter.c"

