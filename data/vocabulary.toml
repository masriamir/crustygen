hanging_meat5_passable = 62
hanging_bloody_twitch_passable = 63
gore_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums, spawnstates, and flags, at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0. Standing corpses (radius = 20*FRACUNIT, height = 16*FRACUNIT, flags = 0 for all seven): MT_MISC63 = 18 (S_POSS_DIE5, dead_zombieman), MT_MISC67 = 19 (S_SPOS_DIE5, dead_shotgun_guy), MT_MISC66 = 20 (S_TROO_DIE5, dead_imp), MT_MISC64 = 21 (S_SARG_DIE6, dead_pinky), MT_MISC61 = 22 (S_HEAD_DIE6, dead_cacodemon), MT_MISC65 = 23 (S_SKULL_DIE6, dead_lost_soul), MT_MISC62 = 15 (S_PLAY_DIE7, dead_player). Gib props (radius = 20*FRACUNIT, height = 16*FRACUNIT, flags = 0): MT_MISC71 = 24 (S_GIBS, gibs), MT_MISC68 = 10 (S_PLAY_XDIE9, bloody_mess), MT_MISC69 = 12 (S_PLAY_XDIE9, bloody_mess_alt — same spawnstate as bloody_mess, hence visually identical). Blood floor decorations (radius = 20*FRACUNIT, height = 16*FRACUNIT, flags = MF_NOBLOCKMAP): MT_MISC85 = 80 (S_SMALLPOOL, small_pool), MT_MISC84 = 79 (S_COLONGIBS, colon_gibs). Bone floor decorations (radius = 16*FRACUNIT, height = 16*FRACUNIT, flags = MF_SOLID): MT_MISC70 = 28 (S_HEADSONSTICK, heads_on_stick), MT_MISC72 = 27 (S_HEADONASTICK, head_on_a_stick), MT_MISC73 = 29 (S_HEADCANDLES, head_candles). Hanging bodies (radius = 16*FRACUNIT, flags = MF_SOLID|MF_SPAWNCEILING|MF_NOGRAVITY): MT_MISC78 = 73 (S_HANGNOGUTS, height = 88*FRACUNIT, hang_no_guts), MT_MISC79 = 74 (S_HANGBNOBRAIN, height = 88*FRACUNIT, hang_no_brain), MT_MISC80 = 75 (S_HANGTLOOKDN, height = 64*FRACUNIT, hang_torso_look_down), MT_MISC81 = 76 (S_HANGTSKULL, height = 64*FRACUNIT, hang_torso_skull), MT_MISC82 = 77 (S_HANGTLOOKUP, height = 64*FRACUNIT, hang_torso_look_up), MT_MISC83 = 78 (S_HANGTNOBRAIN, height = 64*FRACUNIT, hang_torso_no_brain). MF_SPAWNCEILING per p_mobj.h: 'On level spawning (initial position), hang from ceiling instead of stand on floor.' Impaled bodies (radius = 16*FRACUNIT, height = 16*FRACUNIT, flags = MF_SOLID, no MF_SPAWNCEILING, floor-standing): mobjinfo[MT_MISC74] = 25 (S_DEADSTICK, sprite SPR_POL1, impaled_body); mobjinfo[MT_MISC75] = 26 (S_LIVESTICK, sprite SPR_POL6, twitching_impaled_body). Meat-hook set, blocking half (radius = 16*FRACUNIT, flags = MF_SOLID|MF_SPAWNCEILING|MF_NOGRAVITY): mobjinfo[MT_MISC51] = 49 (S_BLOODYTWITCH, sprite SPR_GOR1, radius = 16*FRACUNIT, height = 68*FRACUNIT, hanging_bloody_twitch); mobjinfo[MT_MISC52] = 50 (S_MEAT2, sprite SPR_GOR2, radius = 16*FRACUNIT, height = 84*FRACUNIT, hanging_meat2); mobjinfo[MT_MISC53] = 51 (S_MEAT3, sprite SPR_GOR3, radius = 16*FRACUNIT, height = 84*FRACUNIT, hanging_meat3); mobjinfo[MT_MISC54] = 52 (S_MEAT4, sprite SPR_GOR4, radius = 16*FRACUNIT, height = 68*FRACUNIT, hanging_meat4); mobjinfo[MT_MISC55] = 53 (S_MEAT5, sprite SPR_GOR5, radius = 16*FRACUNIT, height = 52*FRACUNIT, hanging_meat5). Meat-hook set, walk-through half (radius = 20*FRACUNIT, flags = MF_SPAWNCEILING|MF_NOGRAVITY, no MF_SOLID, hence no [props.*] entry): mobjinfo[MT_MISC56] = 59 (S_MEAT2, sprite SPR_GOR2, radius = 20*FRACUNIT, height = 84*FRACUNIT, hanging_meat2_passable); mobjinfo[MT_MISC57] = 60 (S_MEAT4, sprite SPR_GOR4, radius = 20*FRACUNIT, height = 68*FRACUNIT, hanging_meat4_passable); mobjinfo[MT_MISC58] = 61 (S_MEAT3, sprite SPR_GOR3, radius = 20*FRACUNIT, height = 52*FRACUNIT, hanging_meat3_passable); mobjinfo[MT_MISC59] = 62 (S_MEAT5, sprite SPR_GOR5, radius = 20*FRACUNIT, height = 52*FRACUNIT, hanging_meat5_passable); mobjinfo[MT_MISC60] = 63 (S_BLOODYTWITCH, sprite SPR_GOR1, radius = 20*FRACUNIT, height = 68*FRACUNIT, hanging_bloody_twitch_passable). Blood floor decoration (flags = MF_NOBLOCKMAP, non-blocking): mobjinfo[MT_MISC86] = 81 (S_BRAINSTEM, sprite SPR_BRS1, radius = 20*FRACUNIT, height = 16*FRACUNIT, brain_stem). Dims/blocks/hangs for the sixteen MF_SOLID entries are recorded in data/engine.toml's [props.*] table. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c and .../p_mobj.h"

# Linedef specials the compiler writes onto a door portal's two face lines.
#
# `door` is the manual, repeatable open-wait-close door; the `locked` table
# maps each key name in [things] to the keyed door special that key opens.
# Cards and skulls of the same color share a special because the engine
# accepts either — see the citation.
[specials]
door = 1
source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, P_UseSpecialLine: 'case 1: // Vertical Door ... EV_VerticalDoor (line, thing);' and p_doors.c, EV_VerticalDoor: 'case 1: case 26: case 27: case 28: door->type = normal; break;' — `normal` is open-wait-close, and unlike cases 31-34 the special is not cleared afterwards, so type 1 is repeatable. p_switch.c also lists 'case 1: // MANUAL DOOR RAISE' among the specials a non-player thing may activate, so monsters can open it. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c and .../p_doors.c"

[specials.locked]
blue_card = 26
blue_skull = 26
yellow_card = 27
yellow_skull = 27
red_card = 28
red_skull = 28
source = "id-Software/DOOM linuxdoom-1.10/p_doors.c, EV_VerticalDoor lock switch: 'case 26: // Blue Lock / case 32: ... if (!player->cards[it_bluecard] && !player->cards[it_blueskull])'; 'case 27: // Yellow Lock / case 34: ... it_yellowcard ... it_yellowskull'; 'case 28: // Red Lock / case 33: ... it_redcard ... it_redskull' — each keyed type accepts the card OR the skull of its color, which is why both map to the same special. The second switch in the same function gives 'case 1: case 26: case 27: case 28: door->type = normal;', so 26/27/28 are the repeatable open-wait-close forms (31-34 are the one-shot 'open' forms, which clear line->special). p_switch.c, P_UseSpecialLine: 'case 26: // Blue Door/Locked', 'case 27: // Yellow Door /Locked', 'case 28: // Red Door /Locked' route to EV_VerticalDoor. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_doors.c and .../p_switch.c"

# Line specials for the level exit. `progression.exit.kind` (normal | secret)
# and `progression.exit.trigger` (switch | walkover) cross to four specials;
# `kind: both` places one of each normal special and one of each secret
# special rather than needing a fifth entry.
#
# All four are one-shot in vanilla ("S1"/"W1" in the community naming the
# other tables in this file also use): ending the level makes a second use
# moot, so — unlike `door` or `lift` below — no repeatable ("SR"/"WR") variant
# exists for any of them, and none is needed here.
[specials.exit]
switch = 11
walkover = 52
secret_switch = 51
secret_walkover = 124
source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, P_UseSpecialLine: 'case 11: // Exit level / P_ChangeSwitchTexture(line,0); / G_ExitLevel ();' (switch, normal) and 'case 51: // Secret EXIT / P_ChangeSwitchTexture(line,0); / G_SecretExitLevel ();' (switch, secret) — both call P_ChangeSwitchTexture with useAgain=0, vanilla's one-shot ('S1') form. p_spec.c, P_CrossSpecialLine: 'case 52: // EXIT! / G_ExitLevel ();' (walkover, normal) and 'case 124: // Secret EXIT / G_SecretExitLevel ();' (walkover, secret), both in the function's leading 'TRIGGERS' block (one-shot; the level ending makes the usual line->special=0 reset moot). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c and .../p_spec.c"

# Line specials for a lift: Doom's "PlatDownWaitUpStay" plat, which starts
# down and, on trigger, raises to meet the highest neighboring floor, waits,
# then lowers back. `progression.lifts.trigger` needs a switch and a
# walkover form.
#
# The repeatable ("SR"/"WR") forms below are used rather than the one-shot
# ("S1"/"W1") forms vanilla also defines for the same action (21 switch, 10
# walkover): P5 requires a lift to be "operable from both ends", and a
# once-only special would strand whichever side rode it first.
[specials.lift]
switch = 62
walkover = 88
source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, P_UseSpecialLine, under the '// BUTTONS' block: 'case 62: // PlatDownWaitUpStay / if (EV_DoPlat(line,downWaitUpStay,1)) / P_ChangeSwitchTexture(line,1);' — useAgain=1, vanilla's repeatable ('SR') form (the one-shot 'S1' form is case 21, calling P_ChangeSwitchTexture(line,0)). p_spec.c, P_CrossSpecialLine, under the '// RETRIGGERS' block: 'case 88: // PlatDownWaitUp / EV_DoPlat(line,downWaitUpStay,0);' — no line->special=0 reset, vanilla's repeatable ('WR') form (the one-shot 'W1' form is case 10, in the function's leading TRIGGERS block, which does reset it). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c and .../p_spec.c"

# Line specials for a teleporter: the four vanilla forms, crossed on who may
# cross (any thing vs monsters only) and whether the line survives its first
# use (repeatable "WR" vs one-shot "W1"). The IR picks: `monsters_only`
# selects the `!thing->player`-guarded pair, `repeatable` (default true)
# the RETRIGGERS form. Retail id maps use 97 for 98 % of player teleport
# lines and reserve 126/125 for pens the player never enters — see
# docs/measurements/teleports-2026-08-28.md.
#
# Nuance worth recording: unlike most walkover specials, a teleport line is
# *not* usable from its back side even though P_CrossSpecialLine (unlike
# P_UseSpecialLine) does not gate on side by default — EV_Teleport itself
# checks: 'if (side == 1) return 0; // Don't teleport if hit back of line, so
# you can get out of teleporter.' So the "front side only" rule this project
# already treats as a use-special nuance also applies to these walkover
# specials, deliberately, so a teleported thing has an exit route. That side
# gate is why crustygen's construction puts the pad on the trigger line's
# BACK sector: entering the pad fires and leaving it does not, which is what
# the engine rule requires of any pad that is to work at all. The engine
# itself imposes no such geometry — it only refuses a back-side crossing —
# and the corpus agrees with the construction rather than being bound by it
# (back-side pads outnumber front-side ones about ten to one).
[specials.teleport]
repeatable = 97
one_shot = 39
monsters_only = 126
monsters_only_one_shot = 125
source = "id-Software/DOOM linuxdoom-1.10/p_spec.c, P_CrossSpecialLine. Its leading non-player gate names all four together: 'ok = 0; switch(line->special) { case 39: // TELEPORT TRIGGER / case 97: // TELEPORT RETRIGGER / case 125: // TELEPORT MONSTERONLY TRIGGER / case 126: // TELEPORT MONSTERONLY RETRIGGER / case 4: // RAISE DOOR / case 10: // PLAT DOWN-WAIT-UP-STAY TRIGGER / case 88: // PLAT DOWN-WAIT-UP-STAY RETRIGGER / ok = 1; break; } if (!ok) return;' — so a non-player thing may activate any of the four. Under the function's '// TRIGGERS. / // All from here to RETRIGGERS.' block sit the two one-shot ('W1') forms, which clear the special after firing: 'case 39: // TELEPORT! / EV_Teleport( line, side, thing ); / line->special = 0; / break;' and 'case 125: // TELEPORT MonsterONLY / if (!thing->player) { EV_Teleport( line, side, thing ); line->special = 0; } / break;' — note 125's 'line->special = 0;' sits INSIDE the 'if (!thing->player)' guard, so a player crossing it neither teleports nor consumes it. Under the '// RETRIGGERS.  All from here till end.' block sit the two repeatable ('WR') forms, with no reset: 'case 97: // TELEPORT! / EV_Teleport( line, side, thing ); / break;' and 'case 126: // TELEPORT MonsterONLY. / if (!thing->player) / EV_Teleport( line, side, thing ); / break;'. All four call the same p_telept.c EV_Teleport, which begins '// don't teleport missiles / if (thing->flags & MF_MISSILE) return 0;' and '// Don't teleport if hit back of line, so you can get out of teleporter. / if (side == 1) return 0;', then 'tag = line->tag; for (i = 0; i < numsectors; i++) { if (sectors[ i ].tag == tag ) { ... } }' scans the thinker list inside each tagged sector for '// not a teleportman / if (m->type != MT_TELEPORTMAN ) continue;' and '// wrong sector / if (sector-sectors != i ) continue;', then 'if (!P_TeleportMove (thing, m->x, m->y)) return 0;' ... 'thing->angle = m->angle;' ... 'return 1;' — the first matching destination wins, and a blocked P_TeleportMove aborts the whole teleport rather than trying the next one. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_spec.c and .../p_telept.c"

[textures.tech_base]
wall = "STARTAN3"
floor = "FLOOR4_8"
ceiling = "CEIL3_5"
door = "BIGDOOR2"
door_track = "DOORTRAK"
switch = "SW1STARG"
trim = "SUPPORT3"
pad = "GATE3"
switch_width = 128
source = "Verified against tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad (fetched via `just fetch-fixtures` in the crustywad checkout; not modified). FLOOR4_8 (4096 bytes) and CEIL3_5 (4096 bytes) and DOORTRAK (1104 bytes) confirmed present as raw flat/patch lumps in both WADs via `./target/debug/cwad list <wad>`. STARTAN3, BIGDOOR2, DOORTRAK, and STARGR2 (added for the door-redesign task's trim role) confirmed as composite wall textures (present in the TEXTURE1 lump, 963 entries in each WAD) via crustywad::Wad::texture_set().find(name) returning Some for all four, checked with a throwaway binary against the crustywad path dependency"
switch_width_source = "MEASURED, not sourced from the engine: the width in pixels of the `switch` texture's TEXTURE1 definition, read via crustywad::Wad::texture_set() from RETAIL/DOOM.WAD, RETAIL/DOOM2.WAD and RETAIL/freedoom2.wad — SW1STARG is 128x128 in all three. `compile::exits` needs it to centre the switch graphic on an exit line narrower than the texture: with no offset a 64-unit line shows texture columns 0..63, the left half, which is what a playtest reported as a mis-centred switch. Centring the TEXTURE (offsetx = (switch_width - width) / 2) rather than the switch graphic itself is deliberate: the graphic's own position inside the texture is an asset detail that varies between IWADs — measured by composing SW1STARG and SW2STARG and diffing, it spans columns 54..=72 (centre 63) in DOOM2.WAD but 55..=64 (centre 60) in freedoom2.wad — whereas the texture width agrees everywhere. Centring the texture puts the graphic within 1 pixel of the line's centre in DOOM2 and within 4 in Freedoom."
switch_source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, alphSwitchList[]: {\"SW1STARG\", \"SW2STARG\", 1} — the trailing 1 is the episode number, and this table's episode-1 block (the tech-base episode) is where SW1STARG/SW2STARG live, pairing thematically with the STARTAN wall family already used for tech_base. P_ChangeSwitchTexture toggles a placed switch texture to `switchlist[i^1]`, its paired member in this same table, on activation — so the vocabulary only needs the initially-placed (SW1) name; the engine derives the pressed (SW2) counterpart itself via SWITCHES. SW1STARG confirmed present as a composite texture name in both tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad's TEXTURE1 lump via crustywad::Wad::texture_set(), same throwaway-binary method as the row above. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c"
trim_source = "NOT sourced from the engine (nothing in linuxdoom-1.10 names a 'trim' texture role) — a compiler-construction choice, now informed by measurement. SUPPORT3 (64x128) is the standard flanking trim beside a doorway in Doom's own tech maps and sits in the same STARTAN family this theme already draws wall/switch from. It replaces STARGR2 (128x128), which was chosen on thematic grounds alone before any measurement and read as more wall rather than as door trim. Dimensions for SUPPORT3, STARGR2, DOORSTOP (8x128) and DOORTRAK (8x128) were read from the TEXTURE1 definitions of RETAIL/DOOM.WAD, RETAIL/DOOM2.WAD and RETAIL/freedoom2.wad via crustywad::Wad::texture_set(), and agree across all three. SUPPORT3 confirmed present in all three."
pad_source = "NOT sourced from the engine (nothing in linuxdoom-1.10 names a teleporter flat) — a compiler-construction choice fixed by measurement: of 83 free-standing teleport pads in DOOM.WAD + DOOM2.WAD, 79 use a GATE1–GATE4 flat, GATE3 most often (33; GATE2 24, GATE4 11, GATE1 11), and GATE3 leads DOOM.WAD's own tech maps too (13 of 27) — docs/measurements/teleports-2026-08-28.md, probe round 2 (2026-08-28). Confirmed present as a 4096-byte flat lump in tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad via `cwad list <wad> | grep GATE3` (the same fixture check [textures.tech_base].source used)."

# Which texture NAMES read as "a door" to a human mapper. This is deliberately
# NOT a `source` field — see `curated` below in its place. Every value in
# this file otherwise carries a `source` citation to a pinned engine commit
# or a primary spec; this table cannot, because "which textures are door
# textures" is neither a constant in the engine nor derivable from one — it
# is an asset-naming convention. `Tables::is_door_texture` (crustygen's
# compiler crate) rejects a theme whose configured `door` texture is not in
# this list, catching a theme entry that names, say, a wall texture by
# mistake. Deliberately excludes DOORTRAK (the door's *track*, a distinct
# role already carried by `[textures.*].door_track`) and DOORSTOP — an
# earlier revision of this comment called DOORSTOP "a small floor prop",
# which is simply wrong: it is an 8x128 composite wall texture present in
# the TEXTURE1 lump of DOOM.WAD, DOOM2.WAD and freedoom2.wad alike, and it
# is idiomatic *door trim*. It is excluded because 8 pixels is a vertical
# strip, not a panel a door's face could wear — the right conclusion for
# the wrong stated reason. The same width caveat applies to the six
# DOORBLU/RED/YEL names below, which are 8x128 (plain) and 16x128 (the `2`
# variants): they are retained here because they read as door names, but
# their real role is the key trim in `[key_trim]`, not a door's panel.
# Excludes
# the `M_*`-prefixed names (`M_BDOOR`, `M_RDOOR`, `M_YDOOR`) that also
# happen to contain "DOOR" and appear in Freedoom's TEXTURE1 lump — those are
# menu HUD graphics reusing the texture-definition format, not door panels a
# player ever sees on a wall.
[door_texture_catalog]
names = [
  "BIGDOOR1", "BIGDOOR2", "BIGDOOR3", "BIGDOOR4", "BIGDOOR5", "BIGDOOR6", "BIGDOOR7",
  "DOOR1", "DOOR3", "DOOR3L",
  "DOORBLU", "DOORBLU2", "DOORRED", "DOORRED2", "DOORYEL", "DOORYEL2",
  "SPCDOOR0", "SPCDOOR1", "SPCDOOR2", "SPCDOOR3", "SPCDOOR4",
  "AQDOOR01", "AQDOOR02",
  "ZDOORB1", "ZDOORF1", "ZELDOOR", "ICKDOOR1", "TNTDOOR", "EXITDOOR",
]
curated = "NOT sourced from the engine or derivable from it — which texture names read as a door is an asset-naming convention, not an engine constant (see the table's own leading comment above). Hand-curated from the classic id-Software/Freedoom BIGDOOR/DOOR*/SPCDOOR*/ZDOOR* texture-name families that denote a door's own moving panel surface. Every name above confirmed present as a composite texture in both tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad's TEXTURE1 lump via crustywad::Wad::texture_set().find(name), same throwaway-binary method [textures.tech_base].source documents. Deliberately excludes DOORTRAK, DOORSTOP, and the M_*DOOR menu-graphic names — see the table's leading comment for why each is excluded."

# Which texture marks the alcove leading to a locked door, by the key that
# opens it. Like [door_texture_catalog] this is an asset-naming convention
# with no engine constant behind it, so it carries `curated` in place of
# `source` — but unlike that table it is also MEASURED, and the measurement
# is what settles the card-versus-skull split.
#
# Placement: these go on the JAMBS OF A LOCKED PORTAL'S ALCOVES — the trim a
# player faces walking up to the door — never on the door's own track, which
# stays `[textures.*].door_track` (DOORTRAK) unconditionally. They are 8x128
# (plain) and 16x128 (the `2` variants), the same vertical-strip shape as
# DOORTRAK, and are not door panels.
#
# Card versus skull: across DOOM.WAD, DOOM2.WAD, TNT.WAD and PLUTONIA.WAD,
# restricted to maps containing exactly ONE key of a given colour so the
# attribution is unambiguous, the plain name accompanies a keycard 117 times
# against 18 for the `2` variant, and the `2` variant accompanies a skull key
# 92 times against 26 for the plain name. The split holds in the same
# direction for all three colours (blue 45/6 vs 8/30, red 38/6 vs 10/34,
# yellow 34/6 vs 8/28). Not absolute — mappers are not strict, and a map with
# several doors can mix them — but overwhelmingly one-directional.
[key_trim]
blue_card = "DOORBLU"
blue_skull = "DOORBLU2"
red_card = "DOORRED"
red_skull = "DOORRED2"
yellow_card = "DOORYEL"
yellow_skull = "DOORYEL2"
curated = "Asset-naming convention, not an engine constant — nothing in linuxdoom-1.10 associates a texture name with a key. The colour-to-name mapping is self-evident from the names; the card-versus-skull mapping is the measured convention described in the comment above, counted over the four id/Final Doom IWADs in RETAIL/ by correlating each map's key things (doomednums 5/6/13 card and 40/39/38 skull, per this file's [things] table) against the key-door textures its sidedefs carry. All six confirmed present in the TEXTURE1 lump of DOOM.WAD, DOOM2.WAD and freedoom2.wad, at 8x128 (plain) and 16x128 (`2`), via crustywad::Wad::texture_set()."
