powerups_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums: MT_MISC13 = 2023 (S_PSTR), MT_MISC12 = 2013 (S_SOUL), MT_MEGA = 83 (S_MEGA), MT_INV = 2022 (S_PINV), MT_INS = 2024 (S_PINS), MT_MISC14 = 2025 (S_SUIT), MT_MISC16 = 2045 (S_PVIS), MT_MISC15 = 2026 (S_PMAP), at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0. Cross-checked against p_inter.c, P_TouchSpecialThing: SPR_PSTR -> P_GivePower(pw_strength)/GOTBERSERK, SPR_SOUL -> health+=100/GOTSUPER, SPR_MEGA -> health=200 + P_GiveArmor(player,2)/GOTMSPHERE (gated 'if (gamemode != commercial) return;' — Doom II only in vanilla), SPR_PINV -> pw_invulnerability/GOTINVUL, SPR_PINS -> pw_invisibility/GOTINVIS, SPR_SUIT -> pw_ironfeet/GOTSUIT, SPR_PVIS -> pw_infrared/GOTVISOR, SPR_PMAP -> pw_allmap/GOTMAP. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c and .../p_inter.c"

# Hazards and scenery. `barrel`, `techno_lamp`, `floor_lamp`, and
# `candelabra` block movement (MF_SOLID) and carry a matching `[props.*]`
# entry in engine.toml (radius/height/blocks) for rules P3, P21, and P22.
# `candle` is the one common non-blocking decoration prop — flags = 0
# (non-blocking) in mobjinfo, so it carries no `[props.*]` entry.
#
# `gibs` (MT_MISC71, doomednum 24) previously lived in this block too, but
# its own citation already called it a corpse/gib item, contradicting its
# placement here — every other non-blocking mobjinfo entry mobjinfo defines
# is a corpse/gib/blood item the template's own comment assigns to
# `scenery.gore`, not `scenery.decorations` (design doc §5, "gore: ...
# corpses, blood, impaled bodies"). It now lives in the `# Gore` block below
# with the rest of that set, where its own reasoning always said it belonged.
barrel = 2035
floor_lamp = 2028
techno_lamp = 85
candelabra = 35
candle = 34
scenery_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums, at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0: MT_BARREL = 2035 (S_BAR1, flags MF_SOLID|MF_SHOOTABLE|MF_NOBLOOD), MT_MISC31 = 2028 (S_COLU, 'Floor lamp', MF_SOLID), MT_MISC29 = 85 (S_TECHLAMP, 'Tall techno lamp', MF_SOLID), MT_MISC50 = 35 (S_CANDELABRA, MF_SOLID), MT_MISC49 = 34 (S_CANDLESTIK, flags = 0, non-blocking). Dims and the blocking flag for the four MF_SOLID entries are recorded in data/engine.toml's [props.*] table. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c"

# Gore. `scenery.gore` (none | light | heavy) needs real things to place.
# Four groups, all read from info.c mobjinfo at the pinned commit; see
# `gore_source` below for the full doomednum/spawnstate/flags citation.
#
#   - Standing corpses (7): the seven post-death idle states, one per
#     killable species this vocabulary already names plus the player.
#     Keyed `dead_<species>` against the matching `[species.*]`/`[things]`
#     key above (`dead_pinky`, not `dead_demon`, to match the `pinky` key
#     this file already uses for MT_SERGEANT). All flags = 0: non-blocking,
#     non-hanging, no `[props.*]` entry.
#   - Gib props (3): `gibs` plus the two doomednums that both spawn the
#     gibbed-player state (S_PLAY_XDIE9) — `bloody_mess`/`bloody_mess_alt`,
#     visually identical placements under two separate doomednums. All
#     flags = 0: non-blocking, no `[props.*]` entry.
#   - Blood/bone floor decorations (5): `small_pool`/`colon_gibs` (blood,
#     flags = MF_NOBLOCKMAP, non-blocking, no `[props.*]` entry) and
#     `heads_on_stick`/`head_on_a_stick`/`head_candles` (bone, flags =
#     MF_SOLID, blocking, floor-standing — not MF_SPAWNCEILING, so distinct
#     from the hanging-bodies group below). The three bone props carry a
#     matching `[props.*]` entry (rules P3, P22).
#   - Hanging bodies (6): the six MF_SOLID|MF_SPAWNCEILING|MF_NOGRAVITY
#     "hang"/"torso" states. Each carries a `[props.*]` entry with
#     `hangs = true` (rule P22 checks headroom beneath a hanging prop).
#
# Not included: MT_MISC51-60 (the "bloody twitch"/meat-hook hanging props,
# doomednums 49-53 and 59-63) — also MF_SPAWNCEILING, but flesh-hook rather
# than corpse/torso shaped, and left for a future pass rather than folded
# into "hanging bodies" by assumption.
dead_zombieman = 18
dead_shotgun_guy = 19
dead_imp = 20
dead_pinky = 21
dead_cacodemon = 22
dead_lost_soul = 23
dead_player = 15
gibs = 24
bloody_mess = 10
bloody_mess_alt = 12
small_pool = 80
colon_gibs = 79
heads_on_stick = 28
head_on_a_stick = 27
head_candles = 29
hang_no_guts = 73
hang_no_brain = 74
hang_torso_look_down = 75
hang_torso_skull = 76
hang_torso_look_up = 77
hang_torso_no_brain = 78
gore_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums, spawnstates, and flags, at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0. Standing corpses (radius = 20*FRACUNIT, height = 16*FRACUNIT, flags = 0 for all seven): MT_MISC63 = 18 (S_POSS_DIE5, dead_zombieman), MT_MISC67 = 19 (S_SPOS_DIE5, dead_shotgun_guy), MT_MISC66 = 20 (S_TROO_DIE5, dead_imp), MT_MISC64 = 21 (S_SARG_DIE6, dead_pinky), MT_MISC61 = 22 (S_HEAD_DIE6, dead_cacodemon), MT_MISC65 = 23 (S_SKULL_DIE6, dead_lost_soul), MT_MISC62 = 15 (S_PLAY_DIE7, dead_player). Gib props (radius = 20*FRACUNIT, height = 16*FRACUNIT, flags = 0): MT_MISC71 = 24 (S_GIBS, gibs), MT_MISC68 = 10 (S_PLAY_XDIE9, bloody_mess), MT_MISC69 = 12 (S_PLAY_XDIE9, bloody_mess_alt — same spawnstate as bloody_mess, hence visually identical). Blood floor decorations (radius = 20*FRACUNIT, height = 16*FRACUNIT, flags = MF_NOBLOCKMAP): MT_MISC85 = 80 (S_SMALLPOOL, small_pool), MT_MISC84 = 79 (S_COLONGIBS, colon_gibs). Bone floor decorations (radius = 16*FRACUNIT, height = 16*FRACUNIT, flags = MF_SOLID): MT_MISC70 = 28 (S_HEADSONSTICK, heads_on_stick), MT_MISC72 = 27 (S_HEADONASTICK, head_on_a_stick), MT_MISC73 = 29 (S_HEADCANDLES, head_candles). Hanging bodies (radius = 16*FRACUNIT, flags = MF_SOLID|MF_SPAWNCEILING|MF_NOGRAVITY): MT_MISC78 = 73 (S_HANGNOGUTS, height = 88*FRACUNIT, hang_no_guts), MT_MISC79 = 74 (S_HANGBNOBRAIN, height = 88*FRACUNIT, hang_no_brain), MT_MISC80 = 75 (S_HANGTLOOKDN, height = 64*FRACUNIT, hang_torso_look_down), MT_MISC81 = 76 (S_HANGTSKULL, height = 64*FRACUNIT, hang_torso_skull), MT_MISC82 = 77 (S_HANGTLOOKUP, height = 64*FRACUNIT, hang_torso_look_up), MT_MISC83 = 78 (S_HANGTNOBRAIN, height = 64*FRACUNIT, hang_torso_no_brain). MF_SPAWNCEILING per p_mobj.h: 'On level spawning (initial position), hang from ceiling instead of stand on floor.' Dims/blocks/hangs for the nine MF_SOLID entries are recorded in data/engine.toml's [props.*] table. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c and .../p_mobj.h"

# Linedef specials the compiler writes onto a door portal's two face lines.
#
# `door` is the manual, repeatable open-wait-close door; the `locked` table
# maps each key name in [things] to the keyed door special that key opens.
# Cards and skulls of the same color share a special because the engine
# accepts either — see the citation.
[specials]
door = 1
source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, P_UseSpecialLine: 'case 1: // Vertical Door ... EV_VerticalDoor (line, thing);' and p_doors.c, EV_VerticalDoor: 'case 1: case 26: case 27: case 28: door->type = normal; break;' — `normal` is open-wait-close, and unlike cases 31-34 the special is not cleared afterwards, so type 1 is repeatable. p_switch.c also lists 'case 1: // MANUAL DOOR RAISE' among the specials a non-player thing may activate, so monsters can open it. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c and .../p_doors.c"

[specials.locked]
blue_card = 26
blue_skull = 26
yellow_card = 27
yellow_skull = 27
red_card = 28
red_skull = 28
source = "id-Software/DOOM linuxdoom-1.10/p_doors.c, EV_VerticalDoor lock switch: 'case 26: // Blue Lock / case 32: ... if (!player->cards[it_bluecard] && !player->cards[it_blueskull])'; 'case 27: // Yellow Lock / case 34: ... it_yellowcard ... it_yellowskull'; 'case 28: // Red Lock / case 33: ... it_redcard ... it_redskull' — each keyed type accepts the card OR the skull of its color, which is why both map to the same special. The second switch in the same function gives 'case 1: case 26: case 27: case 28: door->type = normal;', so 26/27/28 are the repeatable open-wait-close forms (31-34 are the one-shot 'open' forms, which clear line->special). p_switch.c, P_UseSpecialLine: 'case 26: // Blue Door/Locked', 'case 27: // Yellow Door /Locked', 'case 28: // Red Door /Locked' route to EV_VerticalDoor. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_doors.c and .../p_switch.c"

# Line specials for the level exit. `progression.exit.kind` (normal | secret)
# and `progression.exit.trigger` (switch | walkover) cross to four specials;
# `kind: both` places one of each normal special and one of each secret
# special rather than needing a fifth entry.
#
# All four are one-shot in vanilla ("S1"/"W1" in the community naming the
# other tables in this file also use): ending the level makes a second use
# moot, so — unlike `door` or `lift` below — no repeatable ("SR"/"WR") variant
# exists for any of them, and none is needed here.
[specials.exit]
switch = 11
walkover = 52
secret_switch = 51
secret_walkover = 124
source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, P_UseSpecialLine: 'case 11: // Exit level / P_ChangeSwitchTexture(line,0); / G_ExitLevel ();' (switch, normal) and 'case 51: // Secret EXIT / P_ChangeSwitchTexture(line,0); / G_SecretExitLevel ();' (switch, secret) — both call P_ChangeSwitchTexture with useAgain=0, vanilla's one-shot ('S1') form. p_spec.c, P_CrossSpecialLine: 'case 52: // EXIT! / G_ExitLevel ();' (walkover, normal) and 'case 124: // Secret EXIT / G_SecretExitLevel ();' (walkover, secret), both in the function's leading 'TRIGGERS' block (one-shot; the level ending makes the usual line->special=0 reset moot). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c and .../p_spec.c"

# Line specials for a lift: Doom's "PlatDownWaitUpStay" plat, which starts
# down and, on trigger, raises to meet the highest neighboring floor, waits,
# then lowers back. `progression.lifts.trigger` needs a switch and a
# walkover form.
#
# The repeatable ("SR"/"WR") forms below are used rather than the one-shot
# ("S1"/"W1") forms vanilla also defines for the same action (21 switch, 10
# walkover): P5 requires a lift to be "operable from both ends", and a
# once-only special would strand whichever side rode it first.
[specials.lift]
switch = 62
walkover = 88
source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, P_UseSpecialLine, under the '// BUTTONS' block: 'case 62: // PlatDownWaitUpStay / if (EV_DoPlat(line,downWaitUpStay,1)) / P_ChangeSwitchTexture(line,1);' — useAgain=1, vanilla's repeatable ('SR') form (the one-shot 'S1' form is case 21, calling P_ChangeSwitchTexture(line,0)). p_spec.c, P_CrossSpecialLine, under the '// RETRIGGERS' block: 'case 88: // PlatDownWaitUp / EV_DoPlat(line,downWaitUpStay,0);' — no line->special=0 reset, vanilla's repeatable ('WR') form (the one-shot 'W1' form is case 10, in the function's leading TRIGGERS block, which does reset it). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c and .../p_spec.c"

# Line special for a teleporter.
#
# The repeatable ("WR") form below is used rather than the one-shot ("W1")
# form vanilla also defines (39, EV_Teleport followed by line->special = 0),
# so the same line can be crossed more than once — by a returning player, or
# by more than one monster in a teleport ambush
# (combat.ambush.teleport_ambushes).
#
# Nuance worth recording: unlike most walkover specials, a teleport line is
# *not* usable from its back side even though P_CrossSpecialLine (unlike
# P_UseSpecialLine) does not gate on side by default — EV_Teleport itself
# checks: 'if (side == 1) return 0; // Don't teleport if hit back of line, so
# you can get out of teleporter.' So the "front side only" rule this project
# already treats as a use-special nuance also applies to this one walkover
# special, deliberately, so a teleported thing has an exit route.
[specials.teleport]
line = 97
source = "id-Software/DOOM linuxdoom-1.10/p_spec.c, P_CrossSpecialLine, under the '// RETRIGGERS' block: 'case 97: // TELEPORT! / EV_Teleport( line, side, thing );' — no line->special=0 reset, vanilla's repeatable ('WR') form (the one-shot 'W1' form is case 39, in the function's leading TRIGGERS block: 'EV_Teleport( line, side, thing ); line->special = 0;'). p_telept.c, EV_Teleport: 'if (side == 1) return 0;' gates activation to the line's front side despite being walkover-triggered. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_spec.c and .../p_telept.c"

[textures.tech_base]
wall = "STARTAN3"
floor = "FLOOR4_8"
ceiling = "CEIL3_5"
door = "BIGDOOR2"
door_track = "DOORTRAK"
switch = "SW1STARG"
trim = "STARGR2"
source = "Verified against tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad (fetched via `just fetch-fixtures` in the crustywad checkout; not modified). FLOOR4_8 (4096 bytes) and CEIL3_5 (4096 bytes) and DOORTRAK (1104 bytes) confirmed present as raw flat/patch lumps in both WADs via `./target/debug/cwad list <wad>`. STARTAN3, BIGDOOR2, DOORTRAK, and STARGR2 (added for the door-redesign task's trim role) confirmed as composite wall textures (present in the TEXTURE1 lump, 963 entries in each WAD) via crustywad::Wad::texture_set().find(name) returning Some for all four, checked with a throwaway binary against the crustywad path dependency"
switch_source = "id-Software/DOOM linuxdoom-1.10/p_switch.c, alphSwitchList[]: {\"SW1STARG\", \"SW2STARG\", 1} — the trailing 1 is the episode number, and this table's episode-1 block (the tech-base episode) is where SW1STARG/SW2STARG live, pairing thematically with the STARTAN wall family already used for tech_base. P_ChangeSwitchTexture toggles a placed switch texture to `switchlist[i^1]`, its paired member in this same table, on activation — so the vocabulary only needs the initially-placed (SW1) name; the engine derives the pressed (SW2) counterpart itself via SWITCHES. SW1STARG confirmed present as a composite texture name in both tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad's TEXTURE1 lump via crustywad::Wad::texture_set(), same throwaway-binary method as the row above. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/p_switch.c"
trim_source = "NOT sourced from the engine (nothing in linuxdoom-1.10 names a 'trim' texture role) — a compiler-construction choice pairing thematically with tech_base's other textures: STARGR2 ('star grate') sits in the same STARTAN/STARG/SW1STARG 'episode 1' texture family this theme already draws wall/switch from (see the switch_source citation above for that family relationship). Confirmed present as a composite texture name in both tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad's TEXTURE1 lump via crustywad::Wad::texture_set(), same throwaway-binary method as the row above."

# Which texture NAMES read as "a door" to a human mapper. This is deliberately
# NOT a `source` field — see `curated` below in its place. Every value in
# this file otherwise carries a `source` citation to a pinned engine commit
# or a primary spec; this table cannot, because "which textures are door
# textures" is neither a constant in the engine nor derivable from one — it
# is an asset-naming convention. `Tables::is_door_texture` (crustygen's
# compiler crate) rejects a theme whose configured `door` texture is not in
# this list, catching a theme entry that names, say, a wall texture by
# mistake. Deliberately excludes DOORTRAK (the door's *track*, a distinct
# role already carried by `[textures.*].door_track`) and DOORSTOP (a small
# floor prop, not a texture that reads as a door's own panel), and excludes
# the `M_*`-prefixed names (`M_BDOOR`, `M_RDOOR`, `M_YDOOR`) that also
# happen to contain "DOOR" and appear in Freedoom's TEXTURE1 lump — those are
# menu HUD graphics reusing the texture-definition format, not door panels a
# player ever sees on a wall.
[door_texture_catalog]
names = [
  "BIGDOOR1", "BIGDOOR2", "BIGDOOR3", "BIGDOOR4", "BIGDOOR5", "BIGDOOR6", "BIGDOOR7",
  "DOOR1", "DOOR3", "DOOR3L",
  "DOORBLU", "DOORBLU2", "DOORRED", "DOORRED2", "DOORYEL", "DOORYEL2",
  "SPCDOOR0", "SPCDOOR1", "SPCDOOR2", "SPCDOOR3", "SPCDOOR4",
  "AQDOOR01", "AQDOOR02",
  "ZDOORB1", "ZDOORF1", "ZELDOOR", "ICKDOOR1", "TNTDOOR", "EXITDOOR",
]
curated = "NOT sourced from the engine or derivable from it — which texture names read as a door is an asset-naming convention, not an engine constant (see the table's own leading comment above). Hand-curated from the classic id-Software/Freedoom BIGDOOR/DOOR*/SPCDOOR*/ZDOOR* texture-name families that denote a door's own moving panel surface. Every name above confirmed present as a composite texture in both tests/fixtures/freedoom/freedoom1.wad and freedoom2.wad's TEXTURE1 lump via crustywad::Wad::texture_set().find(name), same throwaway-binary method [textures.tech_base].source documents. Deliberately excludes DOORTRAK, DOORSTOP, and the M_*DOOR menu-graphic names — see the table's leading comment for why each is excluded."
