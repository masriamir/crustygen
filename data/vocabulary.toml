# Hazards and scenery. Every entry in this block except `candle` blocks
# movement (MF_SOLID) and carries a matching `[props.*]` entry in
# engine.toml (radius/height/blocks) for rules P3, P21, and P22. `candle`
# is the one common non-blocking decoration prop — flags = 0
# (non-blocking) in mobjinfo, so it carries no `[props.*]` entry.
#
# The twenty rows below `candle` are the rest of the vanilla decoration
# set: every remaining mobjinfo entry whose spawnstate is a column, torch,
# tree, lamp, stalagmite, eye, floating skull or burning barrel. They land
# here because the 2026-08 corpus measurement found the thing-kind axis,
# not geometry, is what makes most idgames maps inexpressible, and ordinary
# decorations were the bulk of the misses. `decorations_source` cites every
# one; their dims live in engine.toml's `[props.*]`.
#
# Three naming notes. The first two are choices rather than sourced facts —
# mobjinfo gives every one of these the same 16x16 dims (`big_tree` alone is
# radius 32), so no engine constant separates a tall prop from a short one.
# The `tall_`/`short_` split across the six torches follows their sprite
# pairs (TBLU/TGRN/TRED against SMBT/SMGT/SMRT, "small"). `short_techno_lamp`
# (86, S_TECH2LAMP, sprite TLP2) is named against the `techno_lamp` (85,
# S_TECHLAMP, sprite TLMP) this table already carried, on the same basis.
# The third does rest on an engine fact: the spawnstate is spelled
# S_STALAGTITE, but the entry carries no MF_SPAWNCEILING, so it stands on
# the floor rather than hanging from the ceiling — `stalagmite` names what
# the row actually is.
#
# `gibs` (MT_MISC71, doomednum 24) previously lived in this block too, but
# its own citation already called it a corpse/gib item, contradicting its
# placement here — every other non-blocking mobjinfo entry mobjinfo defines
# is a corpse/gib/blood item the template's own comment assigns to
# `scenery.gore`, not `scenery.decorations` (design doc §5, "gore: ...
# corpses, blood, impaled bodies"). It now lives in the `# Gore` block below
# with the rest of that set, where its own reasoning always said it belonged.
barrel = 2035
floor_lamp = 2028
techno_lamp = 85
candelabra = 35
candle = 34

