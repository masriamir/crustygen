scenery_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums, at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0: MT_BARREL = 2035 (S_BAR1, flags MF_SOLID|MF_SHOOTABLE|MF_NOBLOOD), MT_MISC31 = 2028 (S_COLU, 'Floor lamp', MF_SOLID), MT_MISC29 = 85 (S_TECHLAMP, 'Tall techno lamp', MF_SOLID), MT_MISC50 = 35 (S_CANDELABRA, MF_SOLID), MT_MISC49 = 34 (S_CANDLESTIK, flags = 0, non-blocking). Dims and the blocking flag for the four MF_SOLID entries are recorded in data/engine.toml's [props.*] table. https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c"
decorations_source = "id-Software/DOOM linuxdoom-1.10/info.c mobjinfo doomednums, spawnstates and flags, at the pinned commit a77dfb96cb91780ca334d0d4cfd86957558007e0, with each spawnstate's sprite read from states[] in the same file. All twenty are flags = MF_SOLID with radius = 16*FRACUNIT and height = 16*FRACUNIT, except big_tree (radius = 32*FRACUNIT); the dims are recorded in data/engine.toml's [props.*] table. Columns and pillars: mobjinfo[MT_MISC32] = 30 (S_TALLGRNCOL, sprite SPR_COL1, tall_green_column); mobjinfo[MT_MISC33] = 31 (S_SHRTGRNCOL, sprite SPR_COL2, short_green_column); mobjinfo[MT_MISC34] = 32 (S_TALLREDCOL, sprite SPR_COL3, tall_red_column); mobjinfo[MT_MISC35] = 33 (S_SHRTREDCOL, sprite SPR_COL4, short_red_column); mobjinfo[MT_MISC37] = 36 (S_HEARTCOL, sprite SPR_COL5, heart_column); mobjinfo[MT_MISC36] = 37 (S_SKULLCOL, sprite SPR_COL6, skull_column); mobjinfo[MT_MISC48] = 48 (S_TECHPILLAR, sprite SPR_ELEC, tech_pillar). Torches: mobjinfo[MT_MISC41] = 44 (S_BLUETORCH, sprite SPR_TBLU, tall_blue_torch); mobjinfo[MT_MISC42] = 45 (S_GREENTORCH, sprite SPR_TGRN, tall_green_torch); mobjinfo[MT_MISC43] = 46 (S_REDTORCH, sprite SPR_TRED, tall_red_torch); mobjinfo[MT_MISC44] = 55 (S_BTORCHSHRT, sprite SPR_SMBT, short_blue_torch); mobjinfo[MT_MISC45] = 56 (S_GTORCHSHRT, sprite SPR_SMGT, short_green_torch); mobjinfo[MT_MISC46] = 57 (S_RTORCHSHRT, sprite SPR_SMRT, short_red_torch). Trees, rock, lamp, and the light/skull/fire props: mobjinfo[MT_MISC40] = 43 (S_TORCHTREE, sprite SPR_TRE1, torch_tree); mobjinfo[MT_MISC76] = 54 (S_BIGTREE, sprite SPR_TRE2, big_tree); mobjinfo[MT_MISC47] = 47 (S_STALAGTITE, sprite SPR_SMIT, stalagmite); mobjinfo[MT_MISC30] = 86 (S_TECH2LAMP, sprite SPR_TLP2, short_techno_lamp); mobjinfo[MT_MISC38] = 41 (S_EVILEYE, sprite SPR_CEYE, evil_eye); mobjinfo[MT_MISC39] = 42 (S_FLOATSKULL, sprite SPR_FSKU, floating_skull); mobjinfo[MT_MISC77] = 70 (S_BBAR1, sprite SPR_FCAN, burning_barrel). https://github.com/id-Software/DOOM/blob/a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10/info.c"

# Gore. `scenery.gore` (none | light | heavy) needs real things to place.
# Six groups, all read from info.c mobjinfo at the pinned commit; see
# `gore_source` below for the full doomednum/spawnstate/flags citation.
#
#   - Standing corpses (7): the seven post-death idle states, one per
#     killable species this vocabulary already names plus the player.
#     Keyed `dead_<species>` against the matching `[species.*]`/`[things]`
#     key above (`dead_pinky`, not `dead_demon`, to match the `pinky` key
#     this file already uses for MT_SERGEANT). All flags = 0: non-blocking,
#     non-hanging, no `[props.*]` entry.
#   - Gib props (3): `gibs` plus the two doomednums that both spawn the
#     gibbed-player state (S_PLAY_XDIE9) — `bloody_mess`/`bloody_mess_alt`,
#     visually identical placements under two separate doomednums. All
#     flags = 0: non-blocking, no `[props.*]` entry.
#   - Blood/bone floor decorations (6): `small_pool`/`colon_gibs`/
#     `brain_stem` (blood, flags = MF_NOBLOCKMAP, non-blocking, no
#     `[props.*]` entry) and
#     `heads_on_stick`/`head_on_a_stick`/`head_candles` (bone, flags =
#     MF_SOLID, blocking, floor-standing — not MF_SPAWNCEILING, so distinct
#     from the hanging-bodies group below). The three bone props carry a
#     matching `[props.*]` entry (rules P3, P22).
#   - Hanging bodies (6): the six MF_SOLID|MF_SPAWNCEILING|MF_NOGRAVITY
#     "hang"/"torso" states. Each carries a `[props.*]` entry with
#     `hangs = true` (rule P22 checks headroom beneath a hanging prop).
#   - Impaled bodies (2): `impaled_body`/`twitching_impaled_body`
#     (MF_SOLID, floor-standing, one `[props.*]` entry each). The
#     "twitching" is not a description borrowed from elsewhere: S_DEADSTICK
#     is a single frame of duration -1, while S_LIVESTICK loops
#     S_LIVESTICK -> S_LIVESTICK2 -> S_LIVESTICK every few tics.
#   - Meat-hook set (10): the MT_MISC51-60 props on doomednums 49-53 and
#     59-63. They were deferred by shape on an earlier pass — flesh-hook
#     rather than corpse/torso shaped, so folding them into "hanging
#     bodies" would have been an assumption. The 2026-08 corpus measurement
#     ranked several of them among the top thing-type blockers, which
#     retires that deferral. mobjinfo splits the ten cleanly: 49-53
#     (MT_MISC51-55) are MF_SOLID|MF_SPAWNCEILING|MF_NOGRAVITY at
#     radius 16 and carry a `[props.*]` entry with `hangs = true`; 59-63
#     (MT_MISC56-60) are the same five sprites at radius 20 with
#     MF_SPAWNCEILING|MF_NOGRAVITY and no MF_SOLID — walk-through twins,
#     keyed with a `_passable` suffix and carrying no `[props.*]` entry.
#     Neither states[] nor mobjinfo names these five by shape, so the keys
#     carry the spawnstate's own index (S_MEAT2 -> `hanging_meat2`) rather
#     than a shape word this table cannot source.
dead_zombieman = 18
dead_shotgun_guy = 19
dead_imp = 20
dead_pinky = 21
dead_cacodemon = 22
dead_lost_soul = 23
dead_player = 15
gibs = 24
bloody_mess = 10
bloody_mess_alt = 12
